[project]
name = "hestia"
version = "0.1.0"
description = "See your business in a real vacant space before you sign the lease."
readme = "README.md"
requires-python = ">=3.11"
# Base: what shared/ needs. Everyone installs this.
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Install only the extras your role needs, e.g.
#   uv pip install -r pyproject.toml --extra dev --extra agent
agent = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "deepagents", "langchain-aws", "langchain-anthropic", "langchain-google-genai", "anthropic", "boto3>=1.34"]
data = ["httpx>=0.27", "duckdb>=1.0", "shapely>=2.0", "numpy>=1.26", "pillow>=10"]
reimagine = ["shapely>=2.0", "numpy>=1.26", "pillow>=10", "opencv-python-headless>=4.9", "boto3>=1.34"]
# Heavy, optional: CLIP index (Data stretch) and the image scorer models (Reimaginer).
vision = ["torch", "transformers", "open-clip-torch", "lancedb"]
dev = ["pytest>=8"]

